<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <clipPath id="peak-clip">
      <circle cx="80" cy="80" r="70" />
    </clipPath>
  </defs>
  <g clip-path="url(#peak-clip)">
    <!-- Sky and harbour, same flat badge language as the reference. -->
    <circle cx="80" cy="80" r="70" fill="#4EA4E8" />
    <path d="M10 112 L150 112 L150 150 L10 150 Z" fill="#2F7EC4" />
    <path
      d="M10 112 C28 108 46 116 64 112 C82 108 100 116 118 112 C134 108 146 114 150 112 L150 122 L10 122 Z"
      fill="#3B8FD0"
    />
    <!-- Clouds -->
    <ellipse cx="36" cy="34" rx="12" ry="7" fill="#FFFFFF" />
    <ellipse cx="48" cy="34" rx="9" ry="6" fill="#FFFFFF" />
    <ellipse cx="118" cy="40" rx="11" ry="6" fill="#FFFFFF" />
    <ellipse cx="128" cy="42" rx="7" ry="5" fill="#FFFFFF" />
    <!-- Tsim Sha Tsui / harbour skyline -->
    <g stroke="#111111" stroke-width="3" stroke-linejoin="round">
      <rect x="16" y="86" width="12" height="28" fill="#B9BDC4" />
      <rect x="30" y="74" width="14" height="40" fill="#9AA0A8" />
      <path d="M46 92 L58 78 L70 92 Z" fill="#C8CCD2" />
      <rect x="50" y="92" width="16" height="22" fill="#B9BDC4" />
      <rect x="108" y="80" width="13" height="34" fill="#9AA0A8" />
      <rect x="123" y="90" width="11" height="24" fill="#B9BDC4" />
      <path d="M132 80 L138 68 L144 80 Z" fill="#C8CCD2" />
    </g>
    <rect x="34" y="80" width="3" height="4" fill="#FFE27A" />
    <rect x="112" y="86" width="3" height="4" fill="#FFE27A" />
    <!-- Victoria Peak -->
    <path
      d="M58 112 C64 86 70 70 80 58 C90 70 98 88 106 112 Z"
      fill="#3F8A3A"
      stroke="#111111"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <path d="M74 78 C78 68 80 58 80 58 C84 68 88 78 90 88 Z" fill="#5EAE4C" />
    <!-- Peak Tower -->
    <g stroke="#111111" stroke-width="3" stroke-linejoin="round">
      <rect x="74" y="62" width="5" height="12" fill="#F4F1EA" />
      <rect x="81" y="62" width="5" height="12" fill="#F4F1EA" />
      <path d="M64 58 C64 48 96 48 96 58 L92 64 L68 64 Z" fill="#F4F1EA" />
      <ellipse cx="80" cy="50" rx="16" ry="6" fill="#F4F1EA" />
    </g>
    <ellipse cx="80" cy="48" rx="8" ry="2.4" fill="#4EA4E8" />
  </g>
  <circle cx="80" cy="80" r="70" stroke="#111111" stroke-width="5" />
</svg>
