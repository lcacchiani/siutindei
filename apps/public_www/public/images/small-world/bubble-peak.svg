<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="peak-glass" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </radialGradient>
    <clipPath id="peak-clip">
      <circle cx="80" cy="80" r="70" />
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="70" fill="#FFE9A0" />
  <circle cx="80" cy="80" r="70" fill="url(#peak-glass)" />
  <g clip-path="url(#peak-clip)">
    <!-- Harbour and skyline at the foot of the Peak -->
    <path d="M10 128 L150 128 L150 150 L10 150 Z" fill="#7CC4B9" />
    <g stroke="#2E1D12" stroke-width="3" stroke-linejoin="round">
      <rect x="18" y="112" width="10" height="18" fill="#57402E" />
      <rect x="30" y="104" width="12" height="26" fill="#2E1D12" />
      <rect x="44" y="116" width="9" height="14" fill="#57402E" />
      <rect x="118" y="110" width="11" height="20" fill="#2E1D12" />
      <rect x="131" y="116" width="9" height="14" fill="#57402E" />
    </g>
    <circle cx="23" cy="118" r="1.5" fill="#F5C51B" />
    <circle cx="36" cy="110" r="1.5" fill="#FFDE64" />
    <circle cx="123.5" cy="116" r="1.5" fill="#F5C51B" />
    <!-- Victoria Peak mountain -->
    <path
      d="M16 128 C28 96 40 78 54 66 C64 58 72 54 80 52 C90 54 102 62 116 78 C128 92 138 110 146 128 Z"
      fill="#5E9636"
      stroke="#2E1D12"
      stroke-width="4"
      stroke-linejoin="round"
    />
    <path
      d="M54 66 C64 58 72 54 80 52 C86 54 94 58 102 66 L80 78 Z"
      fill="#8BC152"
    />
    <!-- Peak Tram climbing the slope -->
    <path
      d="M34 114 L70 78"
      stroke="#2E1D12"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <g transform="rotate(-42 50 98)">
      <rect
        x="38"
        y="90"
        width="24"
        height="14"
        rx="4"
        fill="#F2A0BF"
        stroke="#2E1D12"
        stroke-width="3"
      />
      <rect x="41" y="93" width="6" height="6" rx="2" fill="#FFF7E6" />
      <rect x="49" y="93" width="6" height="6" rx="2" fill="#FFF7E6" />
    </g>
    <!-- Peak Tower (the bowl / wok) -->
    <g stroke="#2E1D12" stroke-width="3.5" stroke-linejoin="round">
      <rect x="70" y="58" width="8" height="16" rx="2" fill="#FFF7E6" />
      <rect x="82" y="58" width="8" height="16" rx="2" fill="#FFF7E6" />
      <path
        d="M56 52 C56 40 104 40 104 52 L100 60 L60 60 Z"
        fill="#FFF7E6"
      />
      <ellipse cx="80" cy="42" rx="20" ry="8" fill="#FFF7E6" />
    </g>
    <ellipse cx="80" cy="40" rx="10" ry="3.2" fill="#A6DCD3" />
    <!-- Sun -->
    <circle
      cx="118"
      cy="36"
      r="9"
      fill="#F5C51B"
      stroke="#2E1D12"
      stroke-width="3"
    />
  </g>
  <circle
    cx="80"
    cy="80"
    r="70"
    stroke="#ffffff"
    stroke-opacity="0.75"
    stroke-width="2.5"
  />
  <path
    d="M32 46 C42 30 60 20 78 19"
    stroke="#ffffff"
    stroke-opacity="0.95"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
