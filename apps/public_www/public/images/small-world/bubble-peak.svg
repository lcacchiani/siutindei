<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="peak-glass" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </radialGradient>
    <clipPath id="peak-clip">
      <circle cx="80" cy="80" r="70" />
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="70" fill="url(#peak-glass)" />
  <g clip-path="url(#peak-clip)">
    <!-- Micro-planet ground -->
    <path
      d="M10 118 C34 104 62 102 80 106 C102 111 130 108 150 100 L150 150 L10 150 Z"
      fill="#2e5d55"
    />
    <!-- Victoria Peak ridge -->
    <path
      d="M18 112 C36 78 52 62 68 56 L82 70 L96 62 C114 76 128 94 142 108 Z"
      fill="#33635c"
    />
    <path
      d="M52 76 C60 66 66 60 68 56 L82 70 L74 82 Z"
      fill="#4f8f86"
      opacity="0.55"
    />
    <!-- Peak Tower -->
    <path d="M60 58 C60 50 76 50 76 58 L78 62 L58 62 Z" fill="#f6f3ec" />
    <rect x="61" y="62" width="3" height="9" fill="#f6f3ec" />
    <rect x="72" y="62" width="3" height="9" fill="#f6f3ec" />
    <!-- Tiny skyline at the harbour edge -->
    <rect x="104" y="86" width="8" height="24" fill="#1d403b" />
    <rect x="115" y="78" width="9" height="32" fill="#274e46" />
    <rect x="127" y="90" width="7" height="20" fill="#1d403b" />
    <circle cx="108" cy="93" r="1.4" fill="#e8b04b" />
    <circle cx="119" cy="86" r="1.4" fill="#e8b04b" />
    <circle cx="130" cy="96" r="1.2" fill="#e8b04b" />
    <circle cx="119" cy="98" r="1.2" fill="#e8b04b" />
    <!-- Moon -->
    <circle cx="112" cy="42" r="9" fill="#f6f3ec" opacity="0.9" />
    <circle cx="116" cy="39" r="8" fill="#233b56" opacity="0" />
  </g>
  <!-- Glass rim and highlight -->
  <circle cx="80" cy="80" r="70" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" />
  <path
    d="M32 46 C42 30 60 20 78 19"
    stroke="#ffffff"
    stroke-opacity="0.65"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
