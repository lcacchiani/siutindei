<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="peak-glass" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </radialGradient>
    <clipPath id="peak-clip">
      <circle cx="80" cy="80" r="70" />
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="70" fill="url(#peak-glass)" />
  <g clip-path="url(#peak-clip)">
    <!-- Micro-planet ground (leaf green) -->
    <path
      d="M10 118 C34 104 62 102 80 106 C102 111 130 108 150 100 L150 150 L10 150 Z"
      fill="#8BC152"
    />
    <!-- Victoria Peak ridge -->
    <path
      d="M18 112 C36 78 52 62 68 56 L82 70 L96 62 C114 76 128 94 142 108 Z"
      fill="#5E9636"
      stroke="#2E1D12"
      stroke-width="4"
      stroke-linejoin="round"
    />
    <path
      d="M52 76 C60 66 66 60 68 56 L82 70 L74 82 Z"
      fill="#8BC152"
    />
    <!-- Peak Tower -->
    <g stroke="#2E1D12" stroke-width="3" stroke-linejoin="round">
      <path d="M60 58 C60 50 76 50 76 58 L78 62 L58 62 Z" fill="#FFF7E6" />
      <rect x="60.5" y="62" width="4" height="9" fill="#FFF7E6" />
      <rect x="71.5" y="62" width="4" height="9" fill="#FFF7E6" />
    </g>
    <!-- Tiny skyline at the harbour edge (chocolate, lit windows) -->
    <g stroke="#2E1D12" stroke-width="3" stroke-linejoin="round">
      <rect x="104" y="86" width="9" height="24" fill="#57402E" />
      <rect x="116" y="78" width="10" height="32" fill="#2E1D12" />
      <rect x="129" y="90" width="8" height="20" fill="#57402E" />
    </g>
    <circle cx="108.5" cy="93" r="1.6" fill="#F5C51B" />
    <circle cx="121" cy="86" r="1.6" fill="#FFDE64" />
    <circle cx="133" cy="96" r="1.4" fill="#F5C51B" />
    <circle cx="121" cy="98" r="1.4" fill="#F5C51B" />
    <!-- Sun -->
    <circle
      cx="112"
      cy="42"
      r="9"
      fill="#F5C51B"
      stroke="#2E1D12"
      stroke-width="3"
    />
  </g>
  <!-- Glass rim and highlight -->
  <circle cx="80" cy="80" r="70" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5" />
  <path
    d="M32 46 C42 30 60 20 78 19"
    stroke="#ffffff"
    stroke-opacity="0.95"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
