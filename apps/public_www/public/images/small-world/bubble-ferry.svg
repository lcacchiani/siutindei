    <path d="M28 118 C40 114 52 122 64 118" stroke="#4f8f86" stroke-width="3" stroke-linecap="round" />
    <path d="M92 122 C104 118 116 126 130 121" stroke="#4f8f86" stroke-width="3" stroke-linecap="round" />
    <!-- Gulls -->
    <path d="M44 44 C47 41 50 41 53 44" stroke="#f6f3ec" stroke-width="2.4" stroke-linecap="round" />
    <path d="M58 36 C61 33 64 33 67 36" stroke="#f6f3ec" stroke-width="2.4" stroke-linecap="round" />
  </g>
  <circle cx="80" cy="80" r="70" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" />
  <path
    d="M32 46 C42 30 60 20 78 19"
