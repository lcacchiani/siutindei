<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="ferry-glass" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </radialGradient>
    <clipPath id="ferry-clip">
      <circle cx="80" cy="80" r="70" />
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="70" fill="url(#ferry-glass)" />
  <g clip-path="url(#ferry-clip)">
    <!-- Harbour water (earth teal) -->
    <path d="M6 104 L154 104 L154 150 L6 150 Z" fill="#7CC4B9" />
    <path
      d="M6 104 C22 100 38 108 54 104 C70 100 86 108 102 104 C118 100 134 108 154 104 L154 116 L6 116 Z"
      fill="#A6DCD3"
    />
    <!-- Star Ferry -->
    <g stroke="#2E1D12" stroke-width="4" stroke-linejoin="round">
      <path d="M38 96 L122 96 L112 108 L48 108 Z" fill="#2E1D12" />
      <rect x="48" y="82" width="64" height="14" rx="4" fill="#FFF7E6" />
      <rect x="56" y="70" width="48" height="12" rx="4" fill="#FFF7E6" />
    </g>
    <circle cx="64" cy="89" r="2.8" fill="#7CC4B9" />
    <circle cx="76" cy="89" r="2.8" fill="#7CC4B9" />
    <circle cx="88" cy="89" r="2.8" fill="#7CC4B9" />
    <circle cx="100" cy="89" r="2.8" fill="#7CC4B9" />
    <rect x="62" y="73" width="36" height="6" rx="3" fill="#A6DCD3" />
    <!-- Funnel (logo yellow) -->
    <rect
      x="73"
      y="56"
      width="14"
      height="14"
      rx="3"
      fill="#F5C51B"
      stroke="#2E1D12"
      stroke-width="3.5"
    />
    <rect x="73" y="56" width="14" height="5" rx="2.5" fill="#DFAE10" />
    <!-- Star on the bow -->
    <path
      d="M46 85.5 L47.5 88.7 L51 89.2 L48.5 91.5 L49.2 95 L46 93.3 L42.8 95 L43.5 91.5 L41 89.2 L44.5 88.7 Z"
      fill="#F5C51B"
      stroke="#2E1D12"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <!-- Wake ripples -->
    <path d="M28 120 C40 116 52 124 64 120" stroke="#FFF7E6" stroke-width="3.5" stroke-linecap="round" />
    <path d="M92 124 C104 120 116 128 130 123" stroke="#FFF7E6" stroke-width="3.5" stroke-linecap="round" />
    <!-- Gulls -->
    <path d="M44 44 C47 41 50 41 53 44" stroke="#2E1D12" stroke-width="3" stroke-linecap="round" />
    <path d="M58 36 C61 33 64 33 67 36" stroke="#2E1D12" stroke-width="3" stroke-linecap="round" />
  </g>
  <circle cx="80" cy="80" r="70" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5" />
  <path
    d="M32 46 C42 30 60 20 78 19"
    stroke="#ffffff"
    stroke-opacity="0.95"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
