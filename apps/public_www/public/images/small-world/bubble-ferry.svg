    <!-- Windows -->
    <g stroke="#2E1D12" stroke-width="2.5">
      <rect x="54" y="68" width="10" height="10" rx="3" fill="#A6DCD3" />
      <rect x="68" y="68" width="10" height="10" rx="3" fill="#A6DCD3" />
      <rect x="82" y="68" width="10" height="10" rx="3" fill="#A6DCD3" />
      <rect x="96" y="68" width="10" height="10" rx="3" fill="#A6DCD3" />
      <rect x="42" y="86" width="12" height="10" rx="3" fill="#A6DCD3" />
      <rect x="58" y="86" width="12" height="10" rx="3" fill="#A6DCD3" />
      <rect x="74" y="86" width="12" height="10" rx="3" fill="#A6DCD3" />
      <rect x="90" y="86" width="12" height="10" rx="3" fill="#A6DCD3" />
      <rect x="106" y="86" width="12" height="10" rx="3" fill="#A6DCD3" />
    </g>
    <!-- Funnel -->
    <rect
      x="72"
      y="44"
      width="16"
      height="22"
      rx="5"
      fill="#F5C51B"
      stroke="#2E1D12"
      stroke-width="3.5"
    />
    <rect x="72" y="44" width="16" height="7" rx="3.5" fill="#DFAE10" />
    <!-- Star on the bow -->
    <path
      d="M28 92 L31.2 98.4 L38.2 99.2 L33 104 L34.4 111 L28 107.4 L21.6 111 L23 104 L17.8 99.2 L24.8 98.4 Z"
