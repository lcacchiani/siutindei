    />
    <!-- Star Ferry -->
    <path d="M38 96 L122 96 L112 108 L48 108 Z" fill="#1d403b" />
    <rect x="48" y="82" width="64" height="14" rx="3" fill="#f6f3ec" />
    <rect x="56" y="70" width="48" height="12" rx="3" fill="#f6f3ec" />
    <circle cx="64" cy="89" r="2.6" fill="#33635c" />
    <circle cx="76" cy="89" r="2.6" fill="#33635c" />
    <circle cx="88" cy="89" r="2.6" fill="#33635c" />
    <circle cx="100" cy="89" r="2.6" fill="#33635c" />
    <rect x="62" y="73" width="36" height="6" rx="2" fill="#4f8f86" />
    <!-- Funnel -->
    <rect x="74" y="58" width="12" height="12" rx="2" fill="#c2703e" />
    <rect x="74" y="58" width="12" height="4" rx="2" fill="#a95c2f" />
    <!-- Star on the bow -->
    <path
