    <path d="M6 108 L154 108 L154 150 L6 150 Z" fill="#7CC4B9" />
    <path
      d="M6 108 C22 104 38 112 54 108 C70 104 86 112 102 108 C118 104 134 112 154 108 L154 120 L6 120 Z"
