<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <radialGradient id="tram-glass" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </radialGradient>
    <clipPath id="tram-clip">
      <circle cx="80" cy="80" r="70" />
    </clipPath>
  </defs>
  <circle cx="80" cy="80" r="70" fill="url(#tram-glass)" />
  <g clip-path="url(#tram-clip)">
    <!-- Street (leaf green) -->
    <path d="M6 116 L154 116 L154 150 L6 150 Z" fill="#8BC152" />
    <rect x="6" y="116" width="148" height="4" fill="#2E1D12" />
    <!-- Overhead line -->
    <path d="M14 30 L146 30" stroke="#2E1D12" stroke-width="2.5" />
    <path d="M80 30 L80 40" stroke="#2E1D12" stroke-width="3" />
    <!-- Double-decker tram body (logo yellow) -->
    <rect
      x="44"
      y="40"
      width="72"
      height="72"
      rx="9"
      fill="#F5C51B"
      stroke="#2E1D12"
      stroke-width="4.5"
    />
    <rect x="46" y="72" width="68" height="7" fill="#DFAE10" />
    <!-- Upper deck windows -->
    <g stroke="#2E1D12" stroke-width="3">
      <rect x="51" y="48" width="14" height="16" rx="4" fill="#FFF7E6" />
      <rect x="69" y="48" width="14" height="16" rx="4" fill="#FFF7E6" />
      <rect x="87" y="48" width="14" height="16" rx="4" fill="#FFF7E6" />
      <!-- Lower deck windows and door -->
      <rect x="51" y="86" width="14" height="14" rx="4" fill="#FFF7E6" />
      <rect x="69" y="86" width="14" height="20" rx="4" fill="#A6DCD3" />
      <rect x="87" y="86" width="14" height="14" rx="4" fill="#FFF7E6" />
    </g>
    <!-- Roof -->
    <rect
      x="40"
      y="33"
      width="80"
      height="11"
      rx="5.5"
      fill="#2E1D12"
      stroke="#2E1D12"
      stroke-width="3"
    />
    <!-- Wheels -->
    <circle cx="60" cy="114" r="7.5" fill="#2E1D12" />
    <circle cx="100" cy="114" r="7.5" fill="#2E1D12" />
    <circle cx="60" cy="114" r="2.8" fill="#A6DCD3" />
    <circle cx="100" cy="114" r="2.8" fill="#A6DCD3" />
    <!-- Headlamp -->
    <circle cx="112" cy="104" r="3" fill="#F2A0BF" stroke="#2E1D12" stroke-width="2" />
  </g>
  <circle cx="80" cy="80" r="70" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5" />
  <path
    d="M32 46 C42 30 60 20 78 19"
    stroke="#ffffff"
    stroke-opacity="0.95"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
