<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Open water -->
  <g stroke="#2E1D12" stroke-width="3.5" stroke-linejoin="round">
    <polygon points="8,62 48,84 48,90 8,68" fill="#7CC4B9" />
    <polygon points="48,84 88,60 88,66 48,90" fill="#5E9E96" />
    <polygon points="48,40 88,60 48,84 8,62" fill="#A6DCD3" />
  </g>
  <!-- Lantau (larger, west) -->
  <g stroke="#2E1D12" stroke-width="3.4" stroke-linejoin="round">
    <polygon points="14,60 36,72 50,60 30,50" fill="#8BC152" />
  </g>
  <path
    d="M24 54 L34 30 L46 54 Z"
    fill="#5E9636"
    stroke="#2E1D12"
    stroke-width="3.2"
    stroke-linejoin="round"
  />
  <path d="M30 48 L34 34 L40 48 Z" fill="#8BC152" />
  <!-- Tiny Buddha-inspired dome on Lantau -->
  <circle
    cx="34"
    cy="36"
    r="5"
    fill="#F5C51B"
    stroke="#2E1D12"
    stroke-width="2.6"
  />
  <!-- Lamma (smaller, south-east) -->
  <g stroke="#2E1D12" stroke-width="3.2" stroke-linejoin="round">
    <polygon points="58,70 70,78 82,68 70,60" fill="#A5D273" />
  </g>
  <circle
    cx="70"
    cy="62"
    r="7"
    fill="#8BC152"
    stroke="#2E1D12"
    stroke-width="3"
  />
  <circle cx="68" cy="59" r="2.2" fill="#A5D273" />
  <!-- Ferry between the islands -->
  <g stroke="#2E1D12" stroke-width="2.6" stroke-linejoin="round">
    <polygon points="48,66 62,72 58,76 44,70" fill="#F5C51B" />
    <polygon points="50,60 56,63 52,68 46,65" fill="#FFF7E6" />
  </g>
  <circle
    cx="80"
    cy="22"
    r="6.5"
    fill="#F5C51B"
    stroke="#2E1D12"
    stroke-width="2.8"
  />
</svg>
