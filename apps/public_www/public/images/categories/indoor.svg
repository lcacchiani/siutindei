<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Ground shadow -->
  <ellipse cx="48" cy="85" rx="36" ry="8" fill="#2E1D12" opacity="0.12" />
  <!-- Toy box interior -->
  <polygon
    points="48,28 79.2,46 48,64 16.8,46"
    fill="#57402E"
    stroke="#2E1D12"
    stroke-width="4"
    stroke-linejoin="round"
  />
  <!-- Balls inside -->
  <circle cx="40" cy="41" r="9" fill="#F5C51B" stroke="#2E1D12" stroke-width="3.5" />
  <circle cx="36.8" cy="37.8" r="2.6" fill="#FFDE64" />
  <circle cx="57" cy="43" r="8" fill="#F2A0BF" stroke="#2E1D12" stroke-width="3.5" />
  <circle cx="54.2" cy="40.2" r="2.2" fill="#FFF7E6" />
  <circle cx="48" cy="33" r="6.5" fill="#8BC152" stroke="#2E1D12" stroke-width="3.5" />
  <circle cx="45.8" cy="30.8" r="2" fill="#A5D273" />
  <!-- Box walls (earth teal) -->
  <g stroke="#2E1D12" stroke-width="4" stroke-linejoin="round">
    <polygon points="16.8,46 48,64 48,88 16.8,70" fill="#A6DCD3" />
    <polygon points="48,64 79.2,46 79.2,70 48,88" fill="#7CC4B9" />
  </g>
  <!-- Heart on the front face -->
  <path
    d="M30 61 C28 58.6 24.4 59.4 24.4 62.4 C24.4 65 27.6 67.4 30 69.6 C32.4 67.4 35.6 65 35.6 62.4 C35.6 59.4 32 58.6 30 61 Z"
    fill="#F2A0BF"
    stroke="#2E1D12"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <!-- Ball outside the box -->
  <circle cx="14" cy="76" r="6" fill="#F5C51B" stroke="#2E1D12" stroke-width="3" />
  <circle cx="12" cy="74" r="1.8" fill="#FFDE64" />
</svg>
