<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- Ground shadow -->
  <ellipse cx="48" cy="74" rx="36" ry="8" fill="#2E1D12" opacity="0.12" />
  <!-- Toy box interior -->
  <polygon
    points="48,17 79.2,35 48,53 16.8,35"
    fill="#57402E"
    stroke="#2E1D12"
    stroke-width="4"
    stroke-linejoin="round"
  />
  <!-- Balls inside -->
  <circle cx="40" cy="30" r="9" fill="#F5C51B" stroke="#2E1D12" stroke-width="3.5" />
  <circle cx="36.8" cy="26.8" r="2.6" fill="#FFDE64" />
  <circle cx="57" cy="32" r="8" fill="#F2A0BF" stroke="#2E1D12" stroke-width="3.5" />
  <circle cx="54.2" cy="29.2" r="2.2" fill="#FFF7E6" />
  <circle cx="48" cy="22" r="6.5" fill="#8BC152" stroke="#2E1D12" stroke-width="3.5" />
  <circle cx="45.8" cy="19.8" r="2" fill="#A5D273" />
  <!-- Box walls (earth teal) -->
  <g stroke="#2E1D12" stroke-width="4" stroke-linejoin="round">
    <polygon points="16.8,35 48,53 48,77 16.8,59" fill="#A6DCD3" />
    <polygon points="48,53 79.2,35 79.2,59 48,77" fill="#7CC4B9" />
  </g>
  <!-- Heart on the front face -->
  <path
    d="M30 50 C28 47.6 24.4 48.4 24.4 51.4 C24.4 54 27.6 56.4 30 58.6 C32.4 56.4 35.6 54 35.6 51.4 C35.6 48.4 32 47.6 30 50 Z"
    fill="#F2A0BF"
    stroke="#2E1D12"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <!-- Ball outside the box -->
  <circle cx="14" cy="65" r="6" fill="#F5C51B" stroke="#2E1D12" stroke-width="3" />
  <circle cx="12" cy="63" r="1.8" fill="#FFDE64" />
</svg>
