<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <clipPath id="planet-clip">
      <circle cx="32" cy="32" r="24.5" />
    </clipPath>
  </defs>
  <!-- Orbit ring: the "precious space" that holds the small world -->
  <ellipse
    cx="32"
    cy="32"
    rx="30"
    ry="11.5"
    stroke="#c2703e"
    stroke-width="2"
    stroke-linecap="round"
    stroke-dasharray="1 6.1"
    transform="rotate(-24 32 32)"
  />
  <!-- Planet -->
  <circle cx="32" cy="32" r="24.5" fill="#f6f3ec" />
  <g clip-path="url(#planet-clip)">
    <!-- Rolling ground -->
    <path
      d="M4 44 C14 36 24 37 32 41 C40 45 50 44 60 38 L60 60 L4 60 Z"
      fill="#33635c"
    />
    <path
      d="M4 50 C16 44 28 46 36 49 C44 52 54 51 60 47 L60 60 L4 60 Z"
      fill="#1d403b"
    />
    <!-- Cozy house sheltered inside the planet -->
    <rect x="26.5" y="30.5" width="11" height="9" rx="1" fill="#e8b04b" />
    <path
      d="M24.5 31.5 L32 24.5 L39.5 31.5 Z"
      fill="#c2703e"
    />
    <rect x="30.4" y="34.5" width="3.2" height="5" rx="0.8" fill="#1d403b" />
  </g>
  <circle cx="32" cy="32" r="24.5" stroke="#1d403b" stroke-width="3" />
  <!-- Discovery spark -->
  <path
    d="M51 9 L52.6 13.4 L57 15 L52.6 16.6 L51 21 L49.4 16.6 L45 15 L49.4 13.4 Z"
    fill="#c2703e"
  />
</svg>
